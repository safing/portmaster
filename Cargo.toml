[workspace]
resolver = "2"
members = [
    "crates/pm-dsd",
    "crates/pm-record",
    "crates/pm-proxy",
    "crates/pm-query",
    "crates/pm-mgr",
    "crates/pm-database",
    "crates/pm-config",
    "crates/pm-api",
    "crates/pm-core",
    "crates/pm-netstate",
    "crates/pm-process",
    "crates/pm-profile",
    "crates/pm-notifications",
    "crates/pm-runtime",
    "crates/pm-netenv",
    "crates/pm-status",
    "crates/pm-intel",
    "crates/pm-geoip",
    "crates/pm-updates",
    "crates/pm-netutils",
    "crates/pm-endpoints",
    "crates/pm-interception",
    "crates/pm-resolver",
    "crates/pm-network",
    "crates/pm-nameserver",
    "crates/pm-netquery",
    "crates/pm-jess",
    "crates/pm-firewall",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22.1"
blake2 = "0.10.6"
blake3 = "1.8.7"
bs58 = "0.5.1"
ciborium = "0.2.2"
ed25519-dalek = "2.2.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
hickory-proto = "0.26.3"
http = "1.5.0"
psl = "2.1.255"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
rmp-serde = "1.3.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
sha3 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
webpki-roots = "1.0.12"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
