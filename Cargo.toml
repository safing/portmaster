[workspace]
resolver = "2"
members = [
    "crates/pm-dsd",
    "crates/pm-record",
    "crates/pm-proxy",
    "crates/pm-query",
    "crates/pm-mgr",
    "crates/pm-database",
    "crates/pm-config",
    "crates/pm-api",
    "crates/pm-core",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
async-trait = "0.1.92"
ciborium = "0.2.2"
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
http = "1.5.0"
regex = "1.13.1"
rmp-serde = "1.3.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
