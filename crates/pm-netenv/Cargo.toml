[package]
name = "pm-netenv"
version = "0.1.0"
edition.workspace = true
description = "Network environment status (online status, captive portal) for the Portmaster core"
license.workspace = true

[dependencies]
pm-mgr = { path = "../pm-mgr" }
pm-netstate = { path = "../pm-netstate" }
pm-netutils = { path = "../pm-netutils" }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
ureq = "3.5.2"
tracing.workspace = true

# `nix` is an empty crate on non-Unix targets; the only users are gated to
# Unix in `icmp.rs` and `system.rs`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["net"] }

[lints]
workspace = true
