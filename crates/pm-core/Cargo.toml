pm-interception = { path = "../pm-interception" }
pm-interop = { path = "../pm-interop" }
pm-mgr = { path = "../pm-mgr" }
pm-migration = { path = "../pm-migration" }
pm-runtime = { path = "../pm-runtime" }
pm-netenv = { path = "../pm-netenv" }
pm-netquery = { path = "../pm-netquery" }
pm-netstate = { path = "../pm-netstate" }
