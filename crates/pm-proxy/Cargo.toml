[package]
name = "pm-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Portmaster Contributors"]
description = "High-performance async Layer-4 TCP/UDP proxy and upstream client for Portmaster"
license = "AGPL-3.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
url = "2"
thiserror = "2"
tracing = "0.1"
bytes = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
