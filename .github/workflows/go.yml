name: Go

on:
  push:
    paths:
      - '**.go'
      - 'cmds/**'
      - 'runtime/**'
      - 'service/**'
      - 'spn/**'
    branches:
      - main
      - no-spn-no-telemetry
      - release-candidate/**
      - development
      - v1-legacy
      - v1-legacy-develop

  pull_request:
    paths:
      - '**.go'
      - 'cmds/**'
      - 'runtime/**'
      - 'service/**'
      - 'spn/**'
    branches:
      - main
      - development
      - v1-legacy
      - v1-legacy-develop

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        # Full history, so that pull requests can be linted against the
        # merge base with their base branch.
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '^1.26'
        cache: false

    # For pull requests, new issues are determined via git against the merge
    # base. The action's only-new-issues fetches the PR diff from the GitHub
    # API instead, which fails for diffs over 20000 lines and then reports
    # every pre-existing issue of the code base.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        only-new-issues: ${{ github.event_name != 'pull_request' }}
        args: -c ./.golangci.yml --timeout 15m ${{ github.event_name == 'pull_request' && format('--new-from-merge-base=origin/{0}', github.base_ref) || '' }}

    - name: Run go vet
      run: go vet ./...

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
    - uses: earthly/actions-setup@43211c7a0eae5344d6d79fb4aaf209c8f8866203 # v1
      with:
        version: v0.8.0
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Go Tests & Build
      run: earthly --ci ${{ github.repository_owner == 'safing' && '--remote-cache=ghcr.io/safing/build-cache --push' || '' }} +go-ci
