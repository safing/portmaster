###########
### Пример

myKey:
  title: Пример подсказки
  content: |
    Это содержимое в формате Markdown.

    Это замечательная новая функция, которая вам понравится!
    Она даже поддерживает возможности Markdown:
    - упорядоченные списки
    - с несколькими пунктами

    И эмодзи :rocket:

    ### :tada: :facepalm:
  url: https://docs.safing.io/?source=Portmaster
  urlText: Показать мне!
  nextKey: navMonitor

##############
### Навигация

introTipup:
  title: Привет!
  content: |
    Спасибо, что установили Portmaster.

intro:
  title: Советы Portmaster
  content: |
    Откройте подсказки, чтобы узнать, как работает Portmaster.

    Подсказки, подобные этой, встречаются по всему Portmaster. Некоторые из них позволяют совершить экскурс по элементу или функции, например так:
  nextKey: navShield

navShield:
  title: Щит статуса и панель управления
  content: |
    Щит даёт общее представление о состоянии Portmaster. Если он станет не зелёного цвета, проверьте уведомление, в котором объясняется, что происходит.

    __Нажмите на щит, чтобы открыть панель управления.__
  nextKey: navMonitor

navMonitor:
  title: Сетевой монитор
  content: |
    Наблюдайте и расследуйте всё, что происходит на вашем устройстве.
  nextKey: navApps
  buttons:
    - name: Начать экскурс
      action:
        Type: open-page
        Payload: monitor
      nextKey: networkMonitor

navApps:
  title: Настройки приложений
  content: |
    Настройте параметры для отдельных приложений, которые переопределяют глобальные значения.
  nextKey: navMap
  buttons:
    - name: Начать экскурс
      action:
        Type: open-page
        Payload: apps
      nextKey: appsTitle

navMap:
  title: Карта SPN
  content: |
    Посмотрите карту SPN и узнайте, как маршрутизируются ваши подключения.
  nextKey: navSettings

navSettings:
  title: Глобальные настройки
  content: |
    Настройте глобальные параметры Portmaster.
  nextKey: navSupport
  buttons:
    - name: Начать экскурс
      action:
        Type: open-page
        Payload: settings
      nextKey: globalSettings

navSupport:
  title: Справка
  content: |
    Сообщите об ошибке, свяжитесь с поддержкой или откройте расширенную документацию Portmaster.
  nextKey: navTools
  buttons:
    - name: Открыть страницу
      action:
        Type: open-page
        Payload: support

navTools:
  title: Версия и инструменты
  content: |
    Посмотрите версию Portmaster и используйте специальные действия и инструменты.
  nextKey: navPause

navPause:
  title: Пауза и возобновление
  content: |
    Временно отключите защиту Portmaster и мониторинг сети.

    Вы можете приостановить только SPN или полностью отключить всю защиту.
  nextKey: navPower

navPower:
  title: Выключение и перезапуск
  content: |
    Выключите или перезапустите Portmaster.
  nextKey: uiMode

uiMode:
  title: Режим интерфейса
  content: |
    Быстро измените объём отображаемых настроек и информации.

    Скрытые настройки продолжают действовать. После закрытия интерфейса всё возвращается к значению по умолчанию.
  buttons:
    - name: Изменить режим по умолчанию
      action:
        Type: "open-setting"
        Payload:
          Key: "core/expertiseLevel"

############
### Боковая панель

pilot-widget:
  title: Состояние Portmaster
  content: |
    Щит показывает текущее состояние Portmaster:

    - 🟢 всё в порядке
    - 🟡 что-то не так, стоит проверить
    - 🔴 опасное состояние, действуйте немедленно

    Этот цветовой код также отображается на значке в системном лотке.

pilot-widget-NetworkRating:
  title: Оценка сети
  content: |
    Управляйте конфиденциальностью даже при подключении к новым сетям.

    В Portmaster можно настроить параметры, которые активны в одной сети, но не в другой: например, разрешить конфиденциальные подключения дома, но не в публичной библиотеке.

    Всё, что нужно делать, — менять оценку сети при подключении к другой сети.
  nextKey: pilot-widget-NetworkRating-Trusted

pilot-widget-NetworkRating-Trusted:
  title: "Оценка сети: доверенная"
  content: |
    Вы считаете текущую сеть безопасной и защищающей вас.

    Примеры:
     - ваша домашняя сеть
     - сеть доверенных друзей
  nextKey: pilot-widget-NetworkRating-Untrusted

pilot-widget-NetworkRating-Untrusted:
  title: "Оценка сети: недоверенная"
  content: |
    Вы не доверяете текущей сети и сомневаетесь, что она защитит вашу конфиденциальность.

    Примеры:
     - публичный WiFi в кафе, библиотеке, поезде, отеле и т. д.
     - сеть родственника, который не разбирается в технологиях
  nextKey: pilot-widget-NetworkRating-Danger

pilot-widget-NetworkRating-Danger:
  title: "Оценка сети: опасная"
  content: |
    Вы считаете, что текущая сеть взломана или иным образом враждебна к вам.

    Примеры:
     - в вашей домашней сети происходит что-то подозрительное

    <small>_Примечание: при оценке «Опасная» Portmaster будет очень защищать вас. Это может нарушить работу приложений или сделать их бесполезными._</small>

broadcast-info:
  title: Широковещательные уведомления
  content: |
    Широковещательные уведомления — это публичные сообщения, которые Portmaster скачивает при проверке обновлений.

    Затем Portmaster локально решает, какие сообщения следует показать.
  url: https://github.com/safing/portmaster/issues/703
  urlText: Подробнее

#############
### Панель управления

dashboardIntro:
  title: Панель управления
  content: |
    Панель управления даёт первое представление об активных функциях Portmaster и о том, что происходит на вашем устройстве.

    Если не указано иное, все графики и статистика основаны на данных, которые Portmaster видел за последние 10 минут, и обновляются каждые 10 секунд.

########################
### Страница сетевого монитора

networkMonitor:
  title: Сетевая активность
  content: |
    Наблюдайте за всем, что происходит на вашем устройстве.

    Просмотрите все сетевые подключения всех приложений и процессов, активных за последние 10 минут. Нажмите на любое приложение или процесс, чтобы изучить его подробнее.

networkMonitor-App-Focus-connection-history:
  title: Сетевая активность
  content: |
    Следите за подключениями в реальном времени. Нажмите на любое подключение, чтобы посмотреть детали и принять меры.
    <br /><br />
    <span class="inline-block">
      <span class="pill-container">
        <span class="counter">2k+</span>
        <span class="pill">
          <span class="percentage"></span>
        </span>
      </span>
    </span> <b>Сводка по статусу</b>
    <br /><br />
    Сгруппированные подключения имеют цветную полосу, показывающую общее количество подключений, а также долю разрешённых (зелёный) и заблокированных/неудачных (серый) подключений.
    <br /><br />
    Отдельное подключение имеет три состояния:<br />
    <span class="verdict accept"></span><span class="verdict accept outdated"></span> <b>Разрешено</b> <br />
    <span class="block verdict"></span><span class="block verdict outdated"></span> <b>Заблокировано</b> <br />
    <span class="verdict failed"></span><span class="verdict failed outdated"></span> <b>Ошибка</b> <br />

    Если круг заполнен, ваши _текущие_ настройки разрешили или заблокировали подключение.<br />
    Если круг пуст, подключение было разрешено или заблокировано _предыдущими_ настройками.
    Ваши текущие настройки могут решить иначе.

########################
### Страница глобальных настроек

globalSettings:
  title: Глобальные настройки
  content: |
    Здесь можно задать системные предпочтения и правила по умолчанию для всех приложений и подключений.

    Просто создайте более строгие глобальные правила, а затем добавьте исключения в настройках приложений, которые переопределяют глобальные значения.

#########################
### Страница настроек приложений

appsTitle:
  title: Обзор приложений
  content: |
    Здесь перечислены все приложения или процессы, которые Portmaster видел активными в сети, и их можно настроить.

    Приложения разделены на категории и отображаются только один раз:

    - **Активные:** приложения, которые сейчас активны и видны в сетевом мониторе
    - **Недавно использовавшиеся:** приложения, активные в течение последней недели
    - **Недавно изменённые:** приложения, настройки которых менялись в течение последней недели
    - **Прочие:** все остальные приложения

appSettings:
  title: Настройки приложения
  content: |
    Здесь можно настроить параметры конкретного приложения, которые переопределяют глобальные настройки.

    Просто создайте более строгие глобальные правила, а затем добавьте исключения в настройках приложения, которые переопределяют глобальные значения.
  nextKey: appSettings-Filter

appSettings-Filter:
  title: Режим отображения
  content: |
    Быстро измените отображаемые настройки:

    **Показать активные:**<br>
    Показывать только настройки приложения, переопределяющие глобальные значения.

    **Показать все:**<br>
    Показывать все настройки. Настройки приложения, переопределяющие глобальные значения, выделены.

appSettings-QuickSettings:
  title: Быстрое изменение важнейших настроек
  content: |
    __Блокировать подключения__

    Задаёт действие по умолчанию, когда ничто другое не разрешает и не блокирует исходящее подключение.

    Если другие настройки могут переопределить это значение, жёлтая точка рядом с переключателем сообщит о возможных исключениях.

    __SPN__

    Быстро включите или отключите SPN для этого приложения.

    Если другие настройки могут переопределить это значение, жёлтая точка рядом с переключателем сообщит о возможных исключениях.

    __Сохранять историю__

    Сохраняйте подключения в базе данных (на диске), чтобы затем просматривать и искать их.
    
    Изменения могут занять несколько минут, чтобы примениться ко всем подключениям.

#########################
### Страница справки

support-page-related-issues:
  title: Локальный поиск проблем
  content: |
    Публичные проблемы ищутся только локально, поэтому никакие данные не покидают ваше устройство, пока вы не решите иначе.

    Публичные проблемы GitHub загружаются через нашу систему поддержки, чтобы не раскрывать обращения к GitHub.

#########################
### Параметры конфигурации

spn:
  title: Сеть конфиденциальности Safing
  content: |
    Сеть конфиденциальности Safing (SPN) — это дополнение Portmaster, которое защищает вашу личность
    и интернет-трафик от посторонних глаз. Она распределяет ваши подключения между несколькими серверами,
    позволяя выходить в интернет из многих мест одновременно, чтобы эффективно скрыть ваши следы.
  url: https://safing.io/spn/?source=Portmaster
  urlText: Подробнее

###########################
# Сопоставление процессов и отпечатки
process-tags:
  title: Теги процессов
  content: Теги содержат специальные метаданные процессов, собираемые Portmaster. Вы можете использовать эти теги в отпечатках для более точного сопоставления процессов, которое иначе было бы гораздо сложнее или невозможно.

navXray:
  title: VPN-подключения (Xray)
  content: |
    Здесь вы управляете подписками и серверами. Выберите страну на карте или подключитесь к конкретному узлу из подписки.
  nextKey: navSettings

navNotifications:
  title: Уведомления
  content: |
    Здесь отображаются предупреждения Portmaster. Откройте уведомление, чтобы увидеть подробности или выбрать действие.
  nextKey: navXray
