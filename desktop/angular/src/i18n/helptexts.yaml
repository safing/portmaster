#############
### Dashboard

dashboardIntro:
  title: 仪表盘
  content: |
    仪表盘为你提供 Portmaster 已启用功能以及设备上正在发生的情况的初步概览。

    除非另有说明，所有图表和统计数据均基于 Portmaster 在过去 10 分钟内观察到的内容，并每 10 秒刷新一次。

########################
### Network Monitor Page

networkMonitor:
  title: 网络活动
  content: |
    查看设备上发生的一切。

    查看过去 10 分钟内所有活跃应用和进程的全部网络连接。点击任意应用或进程以进一步调查。

