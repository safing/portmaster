###########
### Example

myKey:
  title: 提示示例
  content: |
    这是 Markdown 格式的内容。

    这是一项超酷的新功能，你一定会喜欢！
    它甚至支持以下 Markdown 功能：
    - 有序列表
    - 包含多个条目

    以及 :rocket: 表情

    ### :tada: :facepalm:
  url: https://docs.safing.io/?source=Portmaster
