networkMonitor-App-Focus-connection-history:
  title: 网络活动
  content: |
    实时监控连接。点击任意连接可查看详情并执行操作。
    <br /><br />
    <span class="inline-block">
      <span class="pill-container">
        <span class="counter">2k+</span>
        <span class="pill">
          <span class="percentage"></span>
        </span>
      </span>
    </span> <b>状态摘要</b>
    <br /><br />
    分组的连接带有一个彩色条，显示连接总数，
    以及已允许（绿色）与已阻止/失败（灰色）连接之间的比例。
    <br /><br />
    单个连接有三种状态：<br />
    <span class="verdict accept"></span><span class="verdict accept outdated"></span> <b>已允许</b> <br />
    <span class="block verdict"></span><span class="block verdict outdated"></span> <b>已阻止</b> <br />
    <span class="verdict failed"></span><span class="verdict failed outdated"></span> <b>失败</b> <br />

    如果圆圈是实心的，表示是你*当前*的设置允许或阻止了该连接。<br />
    如果圆圈是空心的，表示是*之前*的设置允许或阻止了该连接。
    你当前的设置可能会做出不同的决定。

########################
### Global Settings Page

globalSettings:
  title: 全局设置
  content: |
    你可以在这里设置系统范围的偏好，并为所有应用和连接配置默认规则。

    你可以轻松创建一套更严格的全局规则，然后在应用设置中创建例外，应用设置会覆盖全局默认值。

#########################
### Per-App Settings Page

appsTitle:
  title: 应用概览
  content: |
    Portmaster 观察到在网络上活跃过的所有应用或进程都会列在这里，并可在此进行配置。

    应用按类别划分，且每个应用只会出现一次：

    - **活跃**：当前处于活跃状态、并在网络监控中可见的应用
    - **最近使用**：在过去一周内某个时间活跃过的应用
    - **最近编辑**：在过去一周内编辑过设置的应用
    - **其他**：所有其他应用

appSettings:
  title: 应用设置
  content: |
    你可以在这里配置应用专属设置，这些设置会覆盖全局设置。

    你可以轻松创建一套更严格的全局规则，然后在应用设置中创建例外，应用设置会覆盖全局默认值。
  nextKey: appSettings-Filter

appSettings-Filter:
  title: 显示模式
  content: |
    快速切换要显示的设置：

    **仅显示已生效：**<br>
    只显示覆盖全局默认值的应用专属设置。

    **显示全部：**<br>
    显示所有设置。覆盖全局默认值的应用专属设置会被高亮显示。

appSettings-QuickSettings:
  title: 快速更改最重要的设置
  content: |
    __阻止连接__

    设置当没有其他规则允许或阻止出站连接时的默认操作。

    当其他设置可能覆盖此项时，开关旁会出现一个黄点，提示你可能存在例外。

    __SPN__

    快速为此应用启用或禁用 SPN。

    当其他设置可能覆盖此项时，开关旁会出现一个黄点，提示你可能存在例外。

    __保留历史记录__

    将连接保存到（磁盘上的）数据库中，以便日后查看和搜索。

    更改可能需要几分钟才能应用到所有连接。

#########################
### Support Page

support-page-related-issues:
  title: 本地问题搜索
  content: |
    公开问题仅在本地搜索，因此在你决定之前，不会有任何数据离开你的设备。

    公开的 GitHub 问题通过我们的支持系统下载，以避免你直接暴露给 GitHub。

#########################
### Configuration Options

spn:
  title: Safing 隐私网络
  content: |
    Safing 隐私网络（SPN）是 Portmaster 的一个附加组件，可保护你的身份
    和互联网流量免遭窥探。它将你的连接分散到多台服务器上，
    让你同时从多个地点访问互联网，从而有效地隐藏
    你的踪迹。
  url: https://safing.io/spn/?source=Portmaster
  urlText: 了解更多

###########################
# Process Matching and Fingerprints
process-tags:
  title: 进程标签
  content: 标签保存了进程的特殊元数据，由 Portmaster 收集。你可以在指纹中使用这些标签来更好地匹配进程，否则这些进程将很难甚至无法被正确匹配。
