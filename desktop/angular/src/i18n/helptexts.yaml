  nextKey: navMonitor

##############
### Navigation

introTipup:
  title: 你好！
  content: |
    感谢安装 Portmaster。

intro:
  title: Portmaster 提示
  content: |
    打开提示，了解 Portmaster 的工作原理。

    像这样的提示遍布 Portmaster 各处。部分提示可以带你浏览某个元素或功能，例如：
  nextKey: navShield

navShield:
  title: 状态盾牌与仪表盘
  content: |
    盾牌为你提供 Portmaster 状态的总体概览。如果它变成绿色以外的其他颜色，请查看通知了解发生了什么。

    __点击盾牌即可打开仪表盘。__
  nextKey: navMonitor

navMonitor:
  title: 网络监控
  content: |
    查看并调查设备上发生的一切。
  nextKey: navApps
  buttons:
    - name: 开始导览
      action:
        Type: open-page
        Payload: monitor
      nextKey: networkMonitor

navApps:
  title: 应用设置
  content: |
    配置单个应用的设置，这些设置会覆盖全局默认值。
  nextKey: navMap
  buttons:
    - name: 开始导览
      action:
        Type: open-page
        Payload: apps
      nextKey: appsTitle

navMap:
  title: SPN 地图
  content: |
    查看 SPN 地图，了解你的连接是如何路由的。
  nextKey: navSettings

navSettings:
  title: 全局设置
  content: |
    配置 Portmaster 的全局设置。
  nextKey: navSupport
  buttons:
    - name: 开始导览
      action:
        Type: open-page
        Payload: settings
      nextKey: globalSettings

navSupport:
  title: 获取帮助
  content: |
    报告错误、联系支持或查看完整的 Portmaster 文档。
  nextKey: navTools
  buttons:
    - name: 打开页面
      action:
        Type: open-page
        Payload: support

navTools:
  title: 版本与工具
  content: |
    查看 Portmaster 的版本，并使用特殊操作和工具。
  nextKey: navPause

navPause:
  title: 暂停与恢复
  content: |
    临时禁用 Portmaster 的保护和网络监控。

    可选择仅暂停 SPN，或完全禁用所有保护。
  nextKey: navPower

navPower:
  title: 关闭与重启
  content: |
    关闭或重启 Portmaster。
  nextKey: uiMode

uiMode:
  title: 界面模式
  content: |
    快速调整显示的设置和信息数量。

    隐藏的设置仍然有效。关闭用户界面后，会恢复为默认模式。
  buttons:
    - name: 更改默认界面模式
      action:
        Type: "open-setting"
        Payload:
          Key: "core/expertiseLevel"

############
### Sidedash

pilot-widget:
  title: Portmaster 状态
  content: |
    此盾牌显示 Portmaster 的当前状态：

    - 🟢 一切正常
    - 🟡 有些异常，请检查
    - 🔴 危险状况，请立即处理

    此颜色代码也会显示在系统托盘的图标中。

pilot-widget-NetworkRating:
  title: 网络评级
  content: |
    即使连接到新网络，也能掌控你的隐私。

    在 Portmaster 中，你可以让设置在某一环境中生效、而在另一环境中不生效，例如在家中允许敏感连接，而在公共图书馆则不允许。

    你唯一需要做的，就是在连接到不同网络时更改网络评级。
  nextKey: pilot-widget-NetworkRating-Trusted

pilot-widget-NetworkRating-Trusted:
  title: "网络评级：可信"
  content: |
    你相信当前网络是安全的，能够保护你。

    例如：
     - 你的家庭网络
     - 可信朋友的网络
  nextKey: pilot-widget-NetworkRating-Untrusted

pilot-widget-NetworkRating-Untrusted:
  title: "网络评级：不可信"
  content: |
    你不信任当前网络，怀疑它能否保障你的安全和隐私。

    例如：
     - 咖啡店、图书馆、火车、酒店等场所的公共 WiFi……
     - 不熟悉技术的亲戚的网络
  nextKey: pilot-widget-NetworkRating-Danger

pilot-widget-NetworkRating-Danger:
  title: "网络评级：危险"
  content: |
    你认为当前网络已被入侵或对你存在敌意。

    例如：
     - 你的家庭网络中出现了可疑情况

    <small>_注意：在“危险”评级下，Portmaster 会采取非常严格的保护措施。这可能会破坏应用的功能，甚至导致应用无法使用。_</small>

broadcast-info:
  title: 广播通知
  content: |
    广播通知是 Portmaster 在检查更新时下载的公开消息。

    随后由 Portmaster 在本地决定应显示哪些消息。
  url: https://github.com/safing/portmaster/issues/703
  urlText: 了解更多

