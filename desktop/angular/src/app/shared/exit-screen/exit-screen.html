<div class="content-wrapper">
  <caption>{{ 'exit.tip' | t: undefined : ('' | i18nVersion) }}</caption>
  <fa-icon class="close-icon" icon="times" (click)="cancel()"></fa-icon>

  <h1>{{ 'exit.title' | t: undefined : ('' | i18nVersion) }}</h1>

  <span class="message">{{ 'exit.desc' | t: undefined : ('' | i18nVersion) }}</span>

  <div class="actions">
    <span>
      <input name="neveragain" id="neveragain" [(ngModel)]="neveragain" type="checkbox"> <label for="neveragain">{{ 'exit.never' | t: undefined : ('' | i18nVersion) }}</label>
    </span>

    <button (click)="closeUI()" type="button">{{ 'exit.closeUI' | t: undefined : ('' | i18nVersion) }}</button>
  </div>
</div>
